[project]
name = "ops-paper-analysis"
version = "0.1.0"
description = "Analysis notebooks for the OPS paper"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Alex Hillsley", email = "alexander.hillsley@czbiohub.org" },
]
dependencies = [
    "anndata",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "umap-learn",
    "jupyterlab",
    "ipykernel",
    "gseapy>=1.2.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
